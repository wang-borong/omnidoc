manifest_version = 1
name = "corporate-docs"
version = "1.0.0"
description = "Structured company manuals, product guides, API documentation, and internal standards"
category = "corporate"
recommended_for = ["user manuals", "developer guides", "API documentation", "internal standards"]
compatible_omnidoc = ">=1.8.0,<2.0.0"
compatibility = "readium"

[resources]
html_css = [
  "pandoc/css/modules/corporate-tokens.css",
  "pandoc/css/corporate-docs.css",
  "pandoc/css/modules/semantic-blocks.css",
  "pandoc/css/modules/code.css",
  "pandoc/css/modules/tables.css",
  "pandoc/css/modules/math.css",
  "pandoc/css/modules/figures.css",
]
epub_css = [
  "pandoc/css/modules/corporate-tokens.css",
  "pandoc/css/corporate-docs.css",
  "pandoc/css/modules/semantic-blocks.css",
  "pandoc/css/modules/code.css",
  "pandoc/css/modules/tables.css",
  "pandoc/css/modules/math.css",
  "pandoc/css/modules/figures.css",
]
latex_packages = ["texmf/tex/common/omni-document-themes.sty"]
latex_headers = ["pandoc/headers/corporate-docs.tex"]
lua_filters = [
  "pandoc/data/filters/display-math.lua",
  "pandoc/data/filters/admonition.lua",
  "pandoc/data/filters/fonts-and-alignment.lua",
]
docx_reference_doc = "pandoc/data/reference-docs/corporate-docs.docx"
pptx_reference_doc = "pandoc/data/reference-docs/modern-slides.pptx"

[requirements]
fonts = ["Noto Serif CJK SC", "Noto Sans CJK SC", "Noto Sans Mono CJK SC"]
system_latex_packages = [
  "array",
  "booktabs",
  "colortbl",
  "enumitem",
  "etoolbox",
  "fancyhdr",
  "fontspec",
  "iftex",
  "listings",
  "tcolorbox",
  "titlesec",
  "xcolor",
  "xeCJK",
]

[metadata.defaults]
lang = "zh-CN"
documentclass = "report"
papersize = "a4"
