manifest_version = 1
name = "clean-document"
version = "1.0.0"
description = "A neutral, compact theme for reports, specifications, proposals, and everyday documents"
category = "document"
recommended_for = ["reports", "specifications", "proposals", "meeting notes"]
compatible_omnidoc = ">=1.8.0,<2.0.0"
compatibility = "readium"

[resources]
html_css = [
  "pandoc/css/modules/clean-tokens.css",
  "pandoc/css/clean-document.css",
  "pandoc/css/modules/semantic-blocks.css",
  "pandoc/css/modules/code.css",
  "pandoc/css/modules/tables.css",
  "pandoc/css/modules/math.css",
  "pandoc/css/modules/figures.css",
]
epub_css = [
  "pandoc/css/modules/clean-tokens.css",
  "pandoc/css/clean-document.css",
  "pandoc/css/modules/semantic-blocks.css",
  "pandoc/css/modules/code.css",
  "pandoc/css/modules/tables.css",
  "pandoc/css/modules/math.css",
  "pandoc/css/modules/figures.css",
]
latex_packages = ["texmf/tex/common/omni-document-themes.sty"]
latex_headers = ["pandoc/headers/clean-document.tex"]
lua_filters = [
  "pandoc/data/filters/display-math.lua",
  "pandoc/data/filters/admonition.lua",
  "pandoc/data/filters/fonts-and-alignment.lua",
]
docx_reference_doc = "pandoc/data/reference-docs/clean-document.docx"

[requirements]
fonts = ["Noto Serif CJK SC", "Noto Sans CJK SC", "Noto Sans Mono CJK SC"]
system_latex_packages = [
  "array",
  "booktabs",
  "colortbl",
  "enumitem",
  "etoolbox",
  "fancyhdr",
  "fontspec",
  "iftex",
  "listings",
  "tcolorbox",
  "titlesec",
  "xcolor",
  "xeCJK",
]

[metadata.defaults]
lang = "zh-CN"
documentclass = "article"
papersize = "a4"
