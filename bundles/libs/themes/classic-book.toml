manifest_version = 1
name = "classic-book"
version = "1.0.0"
description = "A restrained serif theme for books, essays, histories, and long-form reading"
category = "book"
recommended_for = ["general books", "essays", "history", "long-form reading"]
compatible_omnidoc = ">=1.8.0,<2.0.0"
compatibility = "readium"

[resources]
html_css = [
  "pandoc/css/modules/classic-tokens.css",
  "pandoc/css/classic-book.css",
  "pandoc/css/modules/semantic-blocks.css",
  "pandoc/css/modules/code.css",
  "pandoc/css/modules/tables.css",
  "pandoc/css/modules/math.css",
  "pandoc/css/modules/figures.css",
]
epub_css = [
  "pandoc/css/modules/classic-tokens.css",
  "pandoc/css/classic-book.css",
  "pandoc/css/modules/semantic-blocks.css",
  "pandoc/css/modules/code.css",
  "pandoc/css/modules/tables.css",
  "pandoc/css/modules/math.css",
  "pandoc/css/modules/figures.css",
]
latex_packages = ["texmf/tex/common/omni-document-themes.sty"]
latex_headers = ["pandoc/headers/classic-book.tex"]
lua_filters = [
  "pandoc/data/filters/display-math.lua",
  "pandoc/data/filters/admonition.lua",
  "pandoc/data/filters/fonts-and-alignment.lua",
]
docx_reference_doc = "pandoc/data/reference-docs/classic-book.docx"

[requirements]
fonts = ["Noto Serif CJK SC", "Noto Sans CJK SC", "Noto Sans Mono CJK SC"]
system_latex_packages = [
  "array",
  "booktabs",
  "colortbl",
  "enumitem",
  "etoolbox",
  "fancyhdr",
  "fontspec",
  "iftex",
  "listings",
  "tcolorbox",
  "titlesec",
  "xcolor",
  "xeCJK",
]

[metadata.defaults]
lang = "zh-CN"
documentclass = "book"
papersize = "a5"
