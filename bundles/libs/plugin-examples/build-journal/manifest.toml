manifest_version = 1
key = "build-journal"
name = "Build Lifecycle Journal"
version = "1.0.0"
compatible_omnidoc = ">=1.7.0,<2.0.0"
description = "Records pre-build and post-build lifecycle events for troubleshooting and automation"
kind = "plugin"

[hooks]
pre_build = ["{python}", "{plugin_dir}/scripts/journal.py"]
post_build = ["{python}", "{plugin_dir}/scripts/journal.py"]
